deterministic: true
seed: 1234
checkpoint_save_interval: 10

mode: "test" # train, test 
pretrained_fpath: null #  # Path to the entire network weight, default = "{outputs_dir}/best_model.pth"
pretrained_backbone_fpath: null
outputs_dir: /mnt/folder_3/shy/beaformer_comparison/outputs/btmri/H2Former/run3 # Output file directory, default = "./outputs/{dataset}/{model}/run{i}"
CUDA_VISIBLE_DEVICES: "0"
dataset: "btmri"
model: "H2Former"

